  <script>
    
    const htmlClass = document.documentElement.classList;
    setTimeout(() => {
      htmlClass.remove("not-ready");
    }, 10);

    
    
    
    const band = document.querySelector(".masthead-band .frontmatter");
    const publishBandHeight = () => {
      if (band) {
        document.documentElement.style.setProperty(
          "--band-h",
          band.getBoundingClientRect().height + "px",
        );
      }
    };
    publishBandHeight();
    addEventListener("resize", publishBandHeight);
    addEventListener("load", publishBandHeight);

    
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    const paper = "#f2f3f4";
    const slate = "#141719";
    const setDark = (isDark) => {
      metaTheme.setAttribute("content", isDark ? slate : paper);
      htmlClass[isDark ? "add" : "remove"]("dark");
      try {
        localStorage.setItem("dark", isDark);
      } catch (e) {}
    };

    
    const darkScheme = window.matchMedia("(prefers-color-scheme: dark)");
    if (htmlClass.contains("dark")) {
      setDark(true);
    } else {
      const darkVal = localStorage.getItem("dark");
      setDark(darkVal ? darkVal === "true" : darkScheme.matches);
    }

    
    darkScheme.addEventListener("change", (event) => {
      setDark(event.matches);
    });

    
    
    const btnDark = document.querySelectorAll(".btn-dark");
    btnDark.forEach((node) => {
      node.addEventListener("click", () => {
        setDark(localStorage.getItem("dark") !== "true");
      });
      node.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          setDark(localStorage.getItem("dark") !== "true");
        }
      });
    });
